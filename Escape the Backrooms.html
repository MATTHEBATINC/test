  const src=x.createMediaStreamSource(st),lp=x.createBiquadFilter(),g=x.createGain();lp.type='lowpass';g.gain.value=0;src.connect(lp);lp.connect(g);
  if(x.createStereoPanner){const pn=x.createStereoPanner();g.connect(pn);pn.connect(x.destination);e.pan=pn}else g.connect(x.destination);
  e.gain=g;e.lp=lp};
 pc.onconnectionstatechange=()=>{if(pc.connectionState==='failed'||pc.connectionState==='closed')nwPcClose(id)};
 if(init)(async()=>{try{await pc.setLocalDescription(await pc.createOffer());NW.rm.emit('rtc',{to:id,k:'o',d:{type:pc.localDescription.type,sdp:pc.localDescription.sdp}})}catch(x){nwPcClose(id)}})();
 return e}
async function nwFlush(e){while(e.ice.length)await e.pc.addIceCandidate(e.ice.shift()).catch(()=>{})}
async function nwRtc(m){const d=m.data;if(!d||d.to!==NW.me||!NW.voice||!NW.ctx||m.isMe)return;const id=m.peer;
 try{
  if(d.k==='o'){const old=NW.pc[id];if(old&&old.pc.signalingState!=='stable')return;if(old)nwPcClose(id);const e=nwPc(id,0);await e.pc.setRemoteDescription(d.d);await nwFlush(e);await e.pc.setLocalDescription(await e.pc.createAnswer());NW.rm.emit('rtc',{to:id,k:'a',d:{type:e.pc.localDescription.type,sdp:e.pc.localDescription.sdp}})}
  else if(d.k==='a'){const e=NW.pc[id];if(e){await e.pc.setRemoteDescription(d.d);await nwFlush(e)}}
  else if(d.k==='i'){const e=NW.pc[id];if(!e)return;if(e.pc.remoteDescription)await e.pc.addIceCandidate(d.d).catch(()=>{});else e.ice.push(d.d)}
 }catch(x){}}
// Volume falls off with distance (full at 0, silent at 30 units), muffled when far, panned by direction; silent across levels.
function nwVol(e,q){if(!e||!e.gain)return;const d=Math.hypot(P.x-q.x,P.z-q.z),k=q.lv===lv?Math.pow(Math.max(0,1-d/30),1.6):0,t=NW.ctx.currentTime;
 e.gain.gain.setTargetAtTime(k,t,.05);e.lp.frequency.setTargetAtTime(500+k*9000,t,.05);
 if(e.pan){const dx=q.x-P.x,dz=q.z-P.z,L=Math.hypot(dx,dz)||1;e.pan.pan.setTargetAtTime(Math.max(-1,Math.min(1,(dx*Math.cos(yaw)-dz*Math.sin(yaw))/L)),t,.05)}}
function nwRtcSync(){if(!NW.voice||!NW.ctx)return;const now=performance.now(),ids=new Set(),here=new Set(),rl=NW.rm&&NW.rm.relay;
 NW.all.forEach(p=>{if(p.isMe)return;here.add(p.peer);const q=p.presence;nwVol(NW.ra[p.peer],q);
  if(rl||!q.vc)return;ids.add(p.peer);
  if(!NW.pc[p.peer]&&NW.me&&NW.me<p.peer&&now>(NW.rt[p.peer]||0))nwPc(p.peer,1);
  nwVol(NW.pc[p.peer],q)});
 for(const id in NW.pc)if(!ids.has(id))nwPcClose(id);
 for(const id in NW.ra)if(!here.has(id)){try{NW.ra[id].gain.disconnect()}catch(x){}delete NW.ra[id]}}
// ===== END VOICE =====

load(0);cam.position.set(P.x,1.6,P.z);cam.rotation.set(0,yaw,0);
